# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - ypfafrica-backend

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # required for actions/checkout

    # We seed the build job with the same env the test suite needs so
    # `npm test` can run before we promote a deploy artifact. These mirror
    # the keys in .github/workflows/ci.yml — keep them in sync.
    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
      IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
      IMAGEKIT_URL_ENDPOINT: ${{ vars.IMAGEKIT_URL_ENDPOINT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAILER: ${{ secrets.EMAILER }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      LOGO_URL: ${{ vars.LOGO_URL }}
      PAYSTACK_SECRET: ${{ secrets.PAYSTACK_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        # Node 22 LTS — Azure App Service Linux's max supported Node
        # runtime. Node 24 is not yet available on App Service and
        # builds against it produce binaries that won't load.
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"

      - name: Install, build, and test
        run: |
          npm ci
          npm run build
          npm test

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read # required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      # Publish-profile auth: a single secret containing the App Service's
      # XML credential. Set it once at the fork level
      # (Settings → Secrets → AZUREAPPSERVICE_PUBLISHPROFILE) — no Entra ID
      # / App Registration / federated identity setup needed.
      - name: "Deploy to Azure Web App"
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "ypfafrica-backend"
          slot-name: "Production"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: .
