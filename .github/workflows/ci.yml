name: CI/CD Pipeline

# Triggers for all your scenarios
on:
  push:
    branches:
      - dev
      - prod
  pull_request:
    branches:
      - dev
      - prod
  workflow_dispatch:

jobs:
  # -----------------------------------------------
  # JOB 1: Build and Test (Runs on all triggers)
  # -----------------------------------------------
  build-and-test:
    runs-on: ubuntu-latest
    environment: "CI/CD Environment"
    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      IMAGEKIT_PUBLIC_KEY: ${{ secrets.IMAGEKIT_PUBLIC_KEY }}
      IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
      IMAGEKIT_URL_ENDPOINT: ${{ vars.IMAGEKIT_URL_ENDPOINT }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAILER: ${{ secrets.EMAILER }}
      ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
      LOGO_URL: ${{ vars.LOGO_URL }}
      PAYSTACK_SECRET: ${{ secrets.PAYSTACK_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS — matches the App Service runtime the deploy
          # workflow targets, so what CI tests is what production runs.
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test

  # The previous version of this file had a `deploy-to-dev` job that fired
  # on push to the `dev` branch and deployed to an Azure App Service named
  # `ypf-backend`. That App Service was provisioned by the original repo
  # author and does NOT exist in this fork's Azure subscription, so the
  # job's `azure/login@v2` step always failed with "client-id and tenant-id
  # not supplied". It's been removed — `dev` pushes still get full CI
  # coverage via the `build-and-test` job above; deploys happen only on
  # push to `prod` via `prod_ypfafrica-backend.yml`. If/when you stand up
  # a real dev App Service, re-add a deploy-to-dev job here that uses the
  # publish-profile pattern from the prod workflow.
