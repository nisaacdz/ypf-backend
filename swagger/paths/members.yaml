/api/v1/members:
get:
summary: Get list of members
tags: [Members]
security:
- cookieAuth: []
parameters:
- in: query
name: chapterId
schema:
type: string
format: uuid
description: Filter by chapter ID
- in: query
name: committeeId
schema:
type: string
format: uuid
description: Filter by committee ID
- in: query
name: page
schema:
type: integer
minimum: 1
default: 1
- in: query
name: pageSize
schema:
type: integer
minimum: 1
maximum: 100
default: 10
- in: query
name: search
schema:
type: string
description: Search query
responses:
200:
description: Members list retrieved successfully
content:
application/json:
schema:
type: object
properties:
success:
type: boolean
data:
type: object
properties:
members:
type: array
items:
$ref: '#/components/schemas/Member'
pagination:
type: object
properties:
page:
type: integer
pageSize:
type: integer
total:
type: integer
400:
description: Invalid query parameters
content:
application/json:
schema:
$ref: '#/components/schemas/Error'
401:
description: Unauthorized
403:
description: Forbidden - requires MEMBER or ADMIN profile

/api/v1/members/{constituentId}:
get:
summary: Get a single member by ID
tags: [Members]
security:
- cookieAuth: []
parameters:
- in: path
name: constituentId
required: true
schema:
type: string
format: uuid
description: Constituent ID - Note that members are identified by their constituent ID
responses:
200:
description: Member details retrieved successfully
content:
application/json:
schema:
type: object
properties:
success:
type: boolean
data:
$ref: '#/components/schemas/MemberDetail'
400:
description: Invalid member ID
content:
application/json:
schema:
$ref: '#/components/schemas/Error'
401:
description: Unauthorized
403:
description: Forbidden - requires MEMBER or ADMIN profile
404:
description: Member not found

/api/v1/members/enroll:
post:
summary: Enroll a constituent as a global member
tags: [Members]
security:
- cookieAuth: []
requestBody:
required: true
content:
application/json:
schema:
type: object
required:
- constituentId
properties:
constituentId:
type: string
format: uuid
startedAt:
type: string
format: date-time
responses:
200:
description: Member enrolled successfully
401:
description: Unauthorized
403:
description: Forbidden - requires SUPER_ADMIN role

/api/v1/members/unenroll:
patch:
summary: Unenroll a constituent from global membership
tags: [Members]
security:
- cookieAuth: []
requestBody:
required: true
content:
application/json:
schema:
type: object
required:
- constituentId
properties:
constituentId:
type: string
format: uuid
responses:
200:
description: Member unenrolled successfully
401:
description: Unauthorized
403:
description: Forbidden - requires SUPER_ADMIN role
404:
description: No active membership found

/api/v1/members/roles:
get:
summary: Get paginated list of member roles/titles
description: Search roles by title or alias. Returns { id, title, alias, _level, scope }
tags: [Members]
security:
- cookieAuth: []
parameters:
- in: query
name: page
schema:
type: integer
minimum: 1
default: 1
- in: query
name: pageSize
schema:
type: integer
minimum: 1
maximum: 100
default: 20
- in: query
name: search
schema:
type: string
description: Search by role title or alias
responses:
200:
description: Roles retrieved successfully
content:
application/json:
schema:
type: object
properties:
success:
type: boolean
data:
type: object
properties:
items:
type: array
items:
$ref: '#/components/schemas/MemberRole'
pagination:
type: object
properties:
page: { type: integer }
pageSize: { type: integer }
total: { type: integer }
401:
description: Unauthorized
403:
description: Forbidden - requires ADMIN or MEMBER leader role

/api/v1/members/leadership:
get:
summary: Get global leadership
description: Returns members with active global role assignments (roles not scoped to chapter/committee)
tags: [Members]
security:
- cookieAuth: []
parameters:
- in: query
name: page
schema:
type: integer
minimum: 1
default: 1
- in: query
name: pageSize
schema:
type: integer
minimum: 1
maximum: 100
default: 20
responses:
200:
description: Leadership retrieved successfully
content:
application/json:
schema:
type: object
properties:
success:
type: boolean
data:
type: object
properties:
items:
type: array
items:
$ref: '#/components/schemas/Member'
pagination:
type: object
properties:
page: { type: integer }
pageSize: { type: integer }
total: { type: integer }
401:
description: Unauthorized
403:
description: Forbidden - requires ADMIN or MEMBER leader role

/api/v1/members/roles/{id}/enroll:
post:
summary: Assign a role to a member
tags: [Members]
security:
- cookieAuth: []
parameters:
- in: path
name: id
required: true
schema:
type: string
format: uuid
description: Role/Title ID
requestBody:
required: true
content:
application/json:
schema:
type: object
required:
- constituentId
properties:
constituentId:
type: string
format: uuid
startedAt:
type: string
format: date-time
responses:
200:
description: Role assigned successfully
401:
description: Unauthorized
403:
description: Forbidden - requires SUPER_ADMIN role
404:
description: No active membership found

/api/v1/members/roles/{id}/unenroll:
patch:
summary: Unassign a role from a member
tags: [Members]
security:
- cookieAuth: []
parameters:
- in: path
name: id
required: true
schema:
type: string
format: uuid
description: Role/Title ID
requestBody:
required: true
content:
application/json:
schema:
type: object
required:
- constituentId
properties:
constituentId:
type: string
format: uuid
responses:
200:
description: Role unassigned successfully
401:
description: Unauthorized
403:
description: Forbidden - requires SUPER_ADMIN role
404:
description: No active role assignment found
