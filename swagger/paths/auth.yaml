/api/v1/auth/login:
  post:
    summary: User login with username and password
    tags: [Authentication]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - username
              - password
            properties:
              username:
                type: string
                description: User's username
              password:
                type: string
                minLength: 4
                maxLength: 55
                description: User's password
    responses:
      200:
        description: Login successful
        headers:
          Set-Cookie:
            schema:
              type: string
              example: access_token=...
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Login successful
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    firstName:
                      type: string
                    lastName:
                      type: string
                    preferredName:
                      type: string
                    profilePhoto:
                      type: object
                    profiles:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            enum: [ADMIN, MEMBER, VOLUNTEER, AUDITOR]
                          startedAt:
                            type: string
                            format: date-time
                          endedAt:
                            type: string
                            format: date-time
                    roles:
                      type: array
                      items:
                        type: object
                        properties:
                          profile:
                            type: string
                          title:
                            type: string
                          startedAt:
                            type: string
                            format: date-time
                          endedAt:
                            type: string
                            format: date-time
                    committees:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                    chapters:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                    auth:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        constituentId:
                          type: string
                          format: uuid
                        email:
                          type: string
                          format: email
                        fullName:
                          type: string
                        roles:
                          type: array
                          items:
                            type: string
                        profiles:
                          type: array
                          items:
                            type: string
                            enum: [ADMIN, MEMBER, VOLUNTEER, AUDITOR]
      400:
        description: Invalid credentials or validation error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"

/api/v1/auth/forgot-password:
  post:
    summary: Initiate password reset process
    description: Sends a one-time password (OTP) to the user's email to begin the password reset process
    tags: [Authentication]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
            properties:
              email:
                type: string
                format: email
                description: User's email address
    responses:
      200:
        description: Password reset code sent successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Password reset code sent to your email
                data:
                  type: null
      400:
        description: Invalid email format
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      404:
        description: User not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"

/api/v1/auth/reset-password:
  post:
    summary: Reset user password with OTP
    description: Completes the password reset process by verifying the OTP and updating the user's password
    tags: [Authentication]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - otp
              - password
            properties:
              email:
                type: string
                format: email
                description: User's email address
              otp:
                type: string
                minLength: 6
                maxLength: 6
                description: Six-digit OTP code received via email
              password:
                type: string
                minLength: 4
                maxLength: 55
                description: New password for the account
    responses:
      200:
        description: Password reset successful and user logged in
        headers:
          Set-Cookie:
            schema:
              type: string
              example: access_token=...
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Login successful
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    firstName:
                      type: string
                    lastName:
                      type: string
                    preferredName:
                      type: string
                    profilePhoto:
                      type: object
                    profiles:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            enum: [ADMIN, MEMBER, VOLUNTEER, AUDITOR]
                          startedAt:
                            type: string
                            format: date-time
                          endedAt:
                            type: string
                            format: date-time
                    roles:
                      type: array
                      items:
                        type: object
                        properties:
                          profile:
                            type: string
                          title:
                            type: string
                          startedAt:
                            type: string
                            format: date-time
                          endedAt:
                            type: string
                            format: date-time
                    committees:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                    chapters:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                    auth:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        constituentId:
                          type: string
                          format: uuid
                        email:
                          type: string
                          format: email
                        fullName:
                          type: string
                        roles:
                          type: array
                          items:
                            type: string
                        profiles:
                          type: array
                          items:
                            type: string
                            enum: [ADMIN, MEMBER, VOLUNTEER, AUDITOR]
      400:
        description: Invalid OTP, OTP expired, or OTP already used
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      404:
        description: User not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"

/api/v1/auth/logout:
  post:
    summary: User logout
    description: Logs out the current user by clearing authentication cookies
    tags: [Authentication]
    responses:
      200:
        description: Logout successful
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: User successfully logged out
                data:
                  type: null

/api/v1/auth/me:
  get:
    summary: Check authentication status
    description: Returns the authenticated user if logged in, null otherwise
    tags: [Authentication]
    responses:
      200:
        description: Authentication status retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  oneOf:
                    - type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        email:
                          type: string
                          format: email
                        fullName:
                          type: string
                        profiles:
                          type: array
                          items:
                            type: string
                            enum: [ADMIN, MEMBER, VOLUNTEER, AUDITOR]
                    - type: null
                      description: User is not authenticated

/api/v1/auth/onboard:
  post:
    summary: Onboard user by sending OTP
    description: Sends an OTP to the user's email if they exist but have no authentication method set.
    tags: [Authentication]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
            properties:
              email:
                type: string
                format: email
                description: User's email address
    responses:
      200:
        description: Onboarding verification code sent successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                  example: true
                message:
                  type: string
                  example: Onboarding verification code sent to your email
                data:
                  type: null
      400:
        description: Validation error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      404:
        description: User not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      409:
        description: User already has an authentication method set
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
