/api/v1/projects:
  get:
    summary: Get list of projects
    tags: [Projects]
    parameters:
      - in: query
        name: filterStatus
        schema:
          type: string
          enum: [UPCOMING, IN_PROGRESS, COMPLETED, CANCELLED]
        description: Filter projects by status
      - in: query
        name: filterType
        schema:
          type: string
          enum: [WELFARE, COMMUNITY, ADVOCACY, OTHER]
        description: Filter projects by type
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - in: query
        name: search
        schema:
          type: string
        description: Search query
    responses:
      200:
        description: Projects list retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: object
                  properties:
                    projects:
                      type: array
                      items:
                        $ref: "#/components/schemas/Project"
                    pagination:
                      type: object
                      properties:
                        page: { type: integer }
                        pageSize: { type: integer }
                        total: { type: integer }
      400:
        description: Invalid query parameters
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"

  post:
    summary: Create a new project
    tags: [Projects]
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - title
              - scheduledStart
              - scheduledEnd
              - status
            properties:
              title:
                type: string
                minLength: 3
                maxLength: 200
              abstract:
                type: string
              description:
                type: string
              scheduledStart:
                type: string
                format: date-time
              scheduledEnd:
                type: string
                format: date-time
              status:
                type: string
                enum: [UPCOMING, IN_PROGRESS, COMPLETED, CANCELLED]
              chapterId:
                type: string
                format: uuid
    responses:
      200:
        description: Project created successfully
      400:
        description: Validation error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      401:
        description: Unauthorized - authentication required
      403:
        description: Forbidden - insufficient permissions

/api/v1/projects/{id}:
  get:
    summary: Get a single project by ID
    tags: [Projects]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: Project ID
    responses:
      200:
        description: Project retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  $ref: "#/components/schemas/Project"
      400:
        description: Invalid project ID
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      404:
        description: Project not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"

  put:
    summary: Update project details
    tags: [Projects]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: Project ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
                minLength: 3
                maxLength: 200
              abstract:
                type: string
              description:
                type: string
              scheduledStart:
                type: string
                format: date-time
              scheduledEnd:
                type: string
                format: date-time
              status:
                type: string
                enum: [UPCOMING, IN_PROGRESS, COMPLETED, CANCELLED]
    responses:
      200:
        description: Project updated successfully
      400:
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      401:
        description: Unauthorized - authentication required
      403:
        description: Forbidden - insufficient permissions
      404:
        description: Project not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"

/api/v1/projects/{id}/media:
  get:
    summary: Get media files for a project
    tags: [Projects]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: Project ID
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - in: query
        name: mediaType
        schema:
          type: string
          enum: [PICTURE, VIDEO]
    responses:
      200:
        description: Media list retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: object
                  properties:
                    media:
                      type: array
                      items:
                        type: object
                        properties:
                          caption: { type: string }
                          medium: { $ref: "#/components/schemas/Medium" }
                    pagination:
                      type: object
                      properties:
                        page: { type: integer }
                        pageSize: { type: integer }
                        total: { type: integer }
      400:
        description: Invalid request parameters
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"

  post:
    summary: Upload media file for a project
    tags: [Projects]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: Project ID
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
                description: Media file (PNG, JPEG up to 50MB or MP4, AVI up to 250MB)
              caption:
                type: string
                maxLength: 255
              isFeatured:
                type: boolean
                default: false
    responses:
      200:
        description: Media uploaded successfully
      400:
        description: Invalid file type, size, or payload
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      401:
        description: Unauthorized
      403:
        description: Forbidden

  patch:
    summary: Update project medium details
    tags: [Projects]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: Project Medium ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              caption:
                type: string
                maxLength: 255
              isFeatured:
                type: boolean
    responses:
      200:
        description: Project medium updated successfully
      400:
        description: Invalid request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      401:
        description: Unauthorized - authentication required
      403:
        description: Forbidden - insufficient permissions
      404:
        description: Project medium not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"

/api/v1/projects/{id}/events:
  get:
    summary: Get events associated with a project
    tags: [Projects]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    responses:
      200:
        description: Project events retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                message:
                  type: string
                data:
                  type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: "#/components/schemas/Event"
                    page:
                      type: integer
                    pageSize:
                      type: integer
                    total:
                      type: integer
      404:
        description: Project not found
