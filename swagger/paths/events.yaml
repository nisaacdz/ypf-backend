/api/v1/events:
  get:
    summary: Get list of events
    tags: [Events]
    parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - in: query
        name: search
        schema:
          type: string
        description: Search query (searches event names and project titles)
    responses:
      200:
        description: Events list retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: "#/components/schemas/Event"
                    pagination:
                      type: object
                      properties:
                        page: { type: integer }
                        pageSize: { type: integer }
                        total: { type: integer }
      400:
        description: Invalid query parameters
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"

  post:
    summary: Create a new event
    tags: [Events]
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - name
              - location
              - scheduledStart
              - scheduledEnd
              - status
              - projectId
            properties:
              name:
                type: string
                minLength: 3
                maxLength: 100
              objective:
                type: string
              location:
                type: string
              scheduledStart:
                type: string
                format: date-time
              scheduledEnd:
                type: string
                format: date-time
              status:
                type: string
                enum: [UPCOMING, ONGOING, COMPLETED, CANCELLED]
              projectId:
                type: string
                format: uuid
    responses:
      200:
        description: Event created successfully
      400:
        description: Validation error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      401:
        description: Unauthorized - authentication required
      403:
        description: Forbidden - insufficient permissions

/api/v1/events/{id}:
  get:
    summary: Get event details
    tags: [Events]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: Event ID
    responses:
      200:
        description: Event details retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  $ref: "#/components/schemas/Event"
      404:
        description: Event not found
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"

  put:
    summary: Update event details
    tags: [Events]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: Event ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                minLength: 3
                maxLength: 100
              location:
                type: string
              scheduledStart:
                type: string
                format: date-time
              scheduledEnd:
                type: string
                format: date-time
              objective:
                type: string
              status:
                type: string
                enum: [UPCOMING, ONGOING, COMPLETED, CANCELLED]
    responses:
      200:
        description: Event updated successfully
      400:
        description: Validation error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      401:
        description: Unauthorized - authentication required
      403:
        description: Forbidden - insufficient permissions
      404:
        description: Event not found

/api/v1/events/{id}/media:
  get:
    summary: Get media files for an event
    tags: [Events]
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: Event ID
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - in: query
        name: mediaType
        schema:
          type: string
          enum: [PICTURE, VIDEO]
    responses:
      200:
        description: Media list retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: object
                  properties:
                    media:
                      type: array
                      items:
                        type: object
                        properties:
                          caption: { type: string }
                          medium: { $ref: "#/components/schemas/Medium" }
                    pagination:
                      type: object
                      properties:
                        page: { type: integer }
                        pageSize: { type: integer }
                        total: { type: integer }
      400:
        description: Invalid request parameters
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"

  post:
    summary: Upload media file for an event
    tags: [Events]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: Event ID
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - file
            properties:
              file:
                type: string
                format: binary
                description: Media file (PNG, JPEG up to 50MB or MP4, AVI up to 250MB)
              caption:
                type: string
                maxLength: 255
              isFeatured:
                type: boolean
                default: false
    responses:
      200:
        description: Media uploaded successfully
      400:
        description: Invalid file type or size
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      401:
        description: Unauthorized
      403:
        description: Forbidden

/api/v1/events/media/{id}:
  patch:
    summary: Update event medium details
    tags: [Events]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: The ID of the event medium record to update
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              caption:
                type: string
                maxLength: 255
              isFeatured:
                type: boolean
    responses:
      200:
        description: Event medium updated successfully
      400:
        description: Validation error
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
      401:
        description: Unauthorized - authentication required
      403:
        description: Forbidden - insufficient permissions
      404:
        description: Event medium not found
