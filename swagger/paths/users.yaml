/api/v1/users/me:
  get:
    summary: Get current authenticated user data
    tags: [Users]
    security:
      - cookieAuth: []
    responses:
      200:
        description: User data retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    email:
                      type: string
                      format: email
                    fullName:
                      type: string
                    constituentId:
                      type: string
                    profiles:
                      type: array
                      items:
                        type: string
                    roles:
                      type: array
                      items:
                        type: string
      401:
        description: Unauthorized - authentication required
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
