/api/v1/chapters:
  get:
    summary: Get list of chapters
    tags: [Chapters]
    security:
      - cookieAuth: []
    parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - in: query
        name: search
        schema:
          type: string
        description: Search query
    responses:
      200:
        description: Chapters list retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Chapter'
                    pagination:
                      type: object
                      properties:
                        page: { type: integer }
                        pageSize: { type: integer }
                        total: { type: integer }
      400:
        description: Invalid query parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      401:
        description: Unauthorized
      403:
        description: Forbidden - requires MEMBER or ADMIN profile

/api/v1/chapters/{id}:
  get:
    summary: Get a single chapter by ID
    tags: [Chapters]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: Chapter ID
    responses:
      200:
        description: Chapter details retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  $ref: '#/components/schemas/ChapterDetail'
      400:
        description: Invalid chapter ID
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      401:
        description: Unauthorized
      403:
        description: Forbidden - requires MEMBER or ADMIN profile
      404:
        description: Chapter not found

/api/v1/chapters/constituents/{constituentId}:
  get:
    summary: Get chapters for a specific constituent
    description: Returns a paginated list of chapters that the constituent is a member of. Only accessible by the constituent themselves or ADMINs.
    tags: [Chapters]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: constituentId
        required: true
        schema:
          type: string
          format: uuid
        description: Constituent ID
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    responses:
      200:
        description: Chapters list retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: object
                  properties:
                    items:
                      type: array
                      items:
                        type: object
                    page:
                      type: integer
                    pageSize:
                      type: integer
                    total:
                      type: integer
      400:
        description: Invalid query parameters or constituent ID
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      401:
        description: Unauthorized - authentication required
      403:
        description: Forbidden - can only access own chapters or requires ADMIN profile

/api/v1/chapters/{id}:
  patch:
    summary: Update a chapter (SUPER_ADMIN or chapter lead only)
    tags: [Chapters]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: Chapter ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Chapter name
              description:
                type: string
                description: Chapter description
              foundingDate:
                type: string
                format: date
                description: Founding date of the chapter
    responses:
      200:
        description: Chapter updated successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: object
      400:
        description: Invalid request body or chapter ID
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      401:
        description: Unauthorized - authentication required
      403:
        description: Forbidden - requires SUPER_ADMIN role or chapter lead role
      404:
        description: Chapter not found

/api/v1/chapters/{id}/leadership:
  get:
    summary: Get chapter leadership
    tags: [Chapters]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: Chapter ID
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
    responses:
      200:
        description: Chapter leadership retrieved successfully
        content:
          application/json:
            schema:
              type: object
              properties:
                success:
                  type: boolean
                data:
                  type: object
                  properties:
                    items:
                      type: array
                      items:
                        type: object
                    pagination:
                      type: object
      400:
        description: Invalid chapter ID or query parameters
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Error'
      401:
        description: Unauthorized
      403:
        description: Forbidden - requires MEMBER or ADMIN profile
      404:
        description: Chapter not found

/api/v1/chapters/{id}/enroll:
  post:
    summary: Enroll a constituent to a chapter
    tags: [Chapters]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: Chapter ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - constituentId
            properties:
              constituentId:
                type: string
                format: uuid
              startedAt:
                type: string
                format: date-time
    responses:
      200:
        description: Enrolled successfully
      401:
        description: Unauthorized
      403:
        description: Forbidden - requires SUPER_ADMIN role
      404:
        description: No active membership found

/api/v1/chapters/{id}/unenroll:
  patch:
    summary: Unenroll a constituent from a chapter
    tags: [Chapters]
    security:
      - cookieAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: Chapter ID
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - constituentId
            properties:
              constituentId:
                type: string
                format: uuid
    responses:
      200:
        description: Unenrolled successfully
      401:
        description: Unauthorized
      403:
        description: Forbidden - requires SUPER_ADMIN role
      404:
        description: No active chapter membership found
