summary: Validate order items before checkout
tags: [Shop]
description: Checks stock levels and product availability for each item in a cart. Invalid entries are omitted from the response instead of causing an error.
requestBody:
required: true
content:
application/json:
schema:
type: object
required:
- items
properties:
items:
type: array
items:
type: object
properties:
productId:
type: string
format: uuid
quantity:
type: number
responses:
200:
description: Returns only the items that passed validation along with the recomputed total amount.
content:
application/json:
schema:
type: object
properties:
success:
type: boolean
message:
type: string
data:
type: object
properties:
validatedItems:
type: array
items:
type: object
properties:
productId:
type: string
format: uuid
quantity:
type: number
price:
type: string
name:
type: string
totalAmount:
type: number
400:
description: Invalid request payload
500:
description: Server error

