Error:
  type: object
  properties:
    success:
      type: boolean
      example: false
    message:
      type: string
      example: Error message

PaginationQuery:
  type: object
  properties:
    page:
      type: integer
      minimum: 1
      default: 1
      description: Page number
    pageSize:
      type: integer
      minimum: 1
      maximum: 100
      default: 10
      description: Number of items per page
    search:
      type: string
      description: Search query

Medium:
  type: object
  properties:
    url:
      type: string
    type:
      type: string
    dimensions:
      type: object
      properties:
        width:
          type: number
        height:
          type: number
    size:
      type: number
    uploadedAt:
      type: string
      format: date-time

Event:
  type: object
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    location:
      type: string
    scheduledStart:
      type: string
      format: date-time
    scheduledEnd:
      type: string
      format: date-time
    objective:
      type: string
    status:
      type: string
      enum: [UPCOMING, ONGOING, COMPLETED, CANCELLED]
    projectId:
      type: string
      format: uuid
    featuredMedia:
      type: array
      items:
        type: object
        properties:
          caption:
            type: string
          medium:
            $ref: '#/components/schemas/Medium'

Project:
  type: object
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
    abstract:
      type: string
    description:
      type: string
    scheduledStart:
      type: string
      format: date-time
    scheduledEnd:
      type: string
      format: date-time
    status:
      type: string
      enum: [UPCOMING, IN_PROGRESS, COMPLETED, CANCELLED]
    chapterId:
      type: string
      format: uuid
    featuredMedia:
      type: array
      items:
        type: object
        properties:
          caption:
            type: string
          medium:
            $ref: '#/components/schemas/Medium'

ShopProduct:
  type: object
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    description:
      type: string
    price:
      type: number
    stock:
      type: integer

Constituent:
  type: object
  properties:
    id:
      type: string
      format: uuid
    profilePhotoUrl:
      type: string
    fullName:
      type: string
    isActive:
      type: boolean
    createdAt:
      type: string
      format: date-time
    profiles:
      type: array
      items:
        type: string
    roles:
      type: array
      items:
        type: string

ConstituentDetail:
  type: object
  properties:
    id:
      type: string
      format: uuid
    firstName:
      type: string
    lastName:
      type: string
    preferredName:
      type: string
    profilePhoto:
      $ref: '#/components/schemas/Medium'
    profiles:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
          startedAt:
            type: string
            format: date-time
          endedAt:
            type: string
            format: date-time
    roles:
      type: array
      items:
        type: object
        properties:
          profile:
            type: string
          title:
            type: string
          startedAt:
            type: string
            format: date-time
          endedAt:
            type: string
            format: date-time
    committees:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
          name:
            type: string
          featuredPhotoUrl:
            type: string
          chapterName:
            type: string
    chapters:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            format: uuid
          name:
            type: string
          country:
            type: string
          featuredPhotoUrl:
            type: string
